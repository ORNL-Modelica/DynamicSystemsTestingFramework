[project]
name = "dstf-decay"
version = "0.1.0"
description = "A minimal backend plug-in for dstf: exponential decay, simulated in-process"
requires-python = ">=3.10"
dependencies = ["dynamic-systems-testing-framework", "numpy"]

# What makes it a plug-in: dstf imports every module named in this group
# before it runs a command, and importing this one registers the backend.
[project.entry-points."dstf.plugins"]
decay = "dstf_decay"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["dstf_decay.py"]
