[project]
name = "dynamic-systems-testing-framework"
version = "1.0.1"
description = "Dynamic Systems Testing Framework — regression & unit testing for time-dependent system behavior, with plug-in backends: Modelica (Dymola, OpenModelica), FMU (FMPy), Julia (ModelingToolkit) and Python to start"
# What the package index shows: the README as the project page (its one image
# is an absolute URL for that), the license by its SPDX name with the file
# beside it, and where the source and the docs are.
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Scott Greenwood" }]
keywords = [
    "modelica", "dymola", "openmodelica", "fmu", "fmi", "julia",
    "modelingtoolkit", "simulation", "regression-testing", "testing",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "numpy>=1.20",
    "psutil>=5.9",
]

[project.optional-dependencies]
# scipy is needed for examples/python/PythonTestingLib/Examples/SimpleRamp.py
# (the Python-backend example uses scipy.integrate.solve_ivp). The end-to-end
# Python-backend tests skip cleanly without it (see tests/test_python_backend.py
# `_scipy_available`), but the default dev install pulls it so the full suite
# runs out of the box.
dev = [
    "pytest>=7.0",
    "scipy>=1.10",
    "ruff>=0.16",
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "types-regex>=2026.9.10",
]
# The authoring shell (`dstf author`). NiceGUI serves the browser UI; the
# figure layer hands it plain figure dicts, so plotly.py stays out of the
# install (tests/test_author_extra.py pins that). regex runs the Variables
# drawer's typed filter with a timeout (`authoring/variable_rows.matcher`).
# Install with: uv sync --extra dev --extra author --locked --inexact
author = ["nicegui>=3.16", "regex>=2026.9.10"]
# FMPy backend (Phase 2). Install with: uv sync --extra fmpy --locked --inexact
# Or with the dev tools:  uv sync --extra dev --extra fmpy --locked
fmpy = ["fmpy>=0.3"]
# Persistent-worker OpenModelica (D70). Drives omc via ZMQ through OMPython
# instead of spawning a subprocess per test. Without it the persistent path
# ABORTS (there is no silent fallback); pass --batch to use the per-test
# subprocess path instead.
# Install with: uv sync --extra om --locked --inexact
om = ["OMPython>=3.5"]

[project.urls]
Homepage = "https://github.com/ORNL-Modelica/DynamicSystemsTestingFramework"
Repository = "https://github.com/ORNL-Modelica/DynamicSystemsTestingFramework"
Documentation = "https://github.com/ORNL-Modelica/DynamicSystemsTestingFramework/blob/main/docs/usage.md"
Issues = "https://github.com/ORNL-Modelica/DynamicSystemsTestingFramework/issues"

[project.scripts]
dstf = "dstf.cli:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dstf"]

# The source archive is what the wheel is built from, and no more: the tests,
# the docs and the example libraries live in the repository.
[tool.hatch.build.targets.sdist]
# A leading slash anchors a pattern at the root: a bare `README.md` also takes
# every example library's own README.
include = ["/src/dstf", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dymola: requires Dymola installation",
    "fmpy: requires fmpy package",
    "ompython: requires OMPython package (persistent-worker OpenModelica)",
    "reference_fmus: requires Reference-FMUs binaries at examples/fmu/reference-fmus-binaries",
    "julia: requires Julia 1.10+ with ModelingToolkit + OrdinaryDiffEq installed in examples/julia/JuliaMtkTestingLib",
    "playwright: browser-driven reporter tests (requires playwright + chromium); until D97 this marker did not exist and -m 'not playwright' was a no-op filter",
]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
# The authoring-shell tests drive NiceGUI's in-process `user_simulation`,
# which is async; auto mode runs a bare `async def test_...` without a
# per-test decorator.
asyncio_mode = "auto"

# --- Quality floor (D88) ---------------------------------------------------

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
# Ruff 0.16 began formatting code blocks inside Markdown. This repo's docs are
# prose with illustrative snippets — reformatting them splits aligned trailing
# comments across lines and would churn ~1,900 changed lines, 97% of them in
# docs/superpowers/ plan documents nobody edits. Lint is unaffected because
# `ruff check` does not read Markdown at all; this exclude is format-only by
# construction. Caveat: an exclude is honored in discovery mode and under
# `--force-exclude` (which the pre-commit hook passes), but NOT when a `.md`
# path is passed explicitly — an editor-on-save integration can still
# reformat one.
exclude = ["*.md"]

[tool.ruff.lint]
# Curated starter set (D88): real-bug rules + import sort + modernization,
# deliberately NOT `--select ALL` (style noise buries genuine defects).
#   F  pyflakes        E/W pycodestyle    B  flake8-bugbear
#   I  isort           UP  pyupgrade      SIM flake8-simplify
select = ["F", "E", "W", "B", "I", "UP", "SIM"]
ignore = [
    "E501",    # line length — formatter owns wrapping; long strings/URLs are fine
    "SIM105",  # try/except/pass — deliberate best-effort cleanup in shutdown/parse
               # paths; contextlib.suppress is not clearer enough to justify churn
    "B905",    # zip() without strict= — not enforced yet; revisit when ratcheting
]

[tool.ruff.lint.per-file-ignores]
# Tests favor readability over lint purity: late imports after fixtures,
# `== True` assertions, throwaway locals, %-format, lambdas.
"tests/**" = ["B011", "SIM", "E402", "E712", "E731", "F841", "UP031", "B905", "B007"]

[tool.mypy]
# Tiered adoption (D88): lenient baseline scoped to the typed-dataclass core.
# The registry/strategy glue, Dymola-logger monkey-patching, and JSON-dict
# flow have poor type signal and are left out of scope for now.
python_version = "3.10"
files = [
    "src/dstf/authoring",
    "src/dstf/backends/pool.py",
    "src/dstf/comparison",
    "src/dstf/discovery",
    "src/dstf/figures",
    "src/dstf/plugins.py",
    "src/dstf/storage",
    "src/dstf/config.py",
    "src/dstf/json_types.py",
    "src/dstf/pipeline.py",
    "src/dstf/reporting/rows.py",
]
ignore_missing_imports = true   # fmpy / OMPython / Dymola interface / julia have no stubs
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["dstf"]
# Omit hardware-gated execution paths (D88): these need an actual simulator
# (or run in a child process coverage can't see), so counting them as misses
# just deflates the metric. Coverage here reflects CI-runnable code.
omit = [
    "*/dstf/__main__.py",
    "*/backends/dymola/*",
    "*/backends/julia/*",
    "*/backends/fmpy/backend.py",
    "*/backends/openmodelica/session_loader.py",
    "*/backends/python/run_test.py",
    "*/backends/cross_backend.py",
]

[tool.coverage.report]
# Ratchet floor (D88): measured baseline 68% on the hardware-free suite
# (after omit-list), set ~2% below to block backsliding without an
# aspirational target. Raise as coverage climbs; never lower silently.
fail_under = 66
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
