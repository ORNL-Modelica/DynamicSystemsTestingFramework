# Quality floor (D88): lint + type-check + the hardware-free test suite +
# coverage ratchet. Runs on a clean ubuntu runner with NO simulators —
# Dymola / Julia / OpenModelica / fmpy tests skip cleanly, Playwright is
# deselected. There is no FMPy end-to-end job (one that fetches the Reference
# FMUs and runs them on a clean runner): it stays deferred on its own cost.
name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: pin to the latest stable tags before relying on this in anger.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # `uv sync` provisions a Python matching requires-python (>=3.10),
      # creates .venv from uv.lock, and installs the project + the dev and
      # author extras (the authoring-shell tests run here; they carry no marker).
      # Tools are then run via `uv run` so they resolve against that venv —
      # no PATH / interpreter ambiguity.
      # `--locked` makes the lockfile an assertion rather than a convention:
      # plain `uv sync` SILENTLY RE-LOCKS when uv.lock has drifted from
      # pyproject.toml (exit 0, no warning), so a raised dependency floor that
      # nobody re-locked would have CI resolve against a lock no one reviewed
      # or committed. With the flag, that drift fails the job instead.
      - name: Sync dependencies
        run: uv sync --extra dev --extra author --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Mypy (core modules)
        run: uv run mypy

      - name: Pytest + coverage ratchet
        # fail_under (66%) lives in pyproject [tool.coverage.report]. Deselect
        # every backend-dependent marker: this runner has no simulators, and
        # not all such tests self-skip — the Julia smoke tests, for instance,
        # shell out to `dstf run` and fail when no Julia worker can start.
        # Playwright is import-skipped at collection but deselected too.
        # `-n 4`: ubuntu-latest has 4 vCPUs (`auto` may count fewer).
        run: >
          uv run pytest -q -n 4
          -m "not playwright and not dymola and not fmpy and not ompython and not julia and not reference_fmus"
          --cov=dstf --cov-report=term-missing

  # The documentation site, built as Read the Docs builds it: every warning
  # is an error (a reference page that names a type it cannot link to, a
  # page in no table of contents). A job of its own, beside the tests, so
  # it adds nothing to their time.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra docs --locked

      - name: Build the site
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
